[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "python-can-csscan-txt"
version = "2026.11.20"
authors = [
    { name="CSS Electronics" },
    { email="contact@csselectronics.com" },
]
description = "Read TXT log files from the CSS Electronics CLX000 CAN loggers through python-can"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    'python-can >= 4.6.0',
]

[project.optional-dependencies]
test = [
    'pytest >= 8.0',
]

[project.entry-points."can.io.message_reader"]
".txt" = "python_can_csscan_txt:LogFile"

[project.urls]
"Homepage" = "https://csselectronics.com/"
"Source" = "https://github.com/CSS-Electronics/python-can-csscan-txt"

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
filterwarnings = [
  "error",
]
